# Single source of parameters (CLAUDE.md §4: "no magic numbers" — every threshold/window/size a
# module uses must be read from here, with a `# why:` comment at the call site, not hardcoded).
# Sections below Step 0's scope (descriptors/similarity/align/verify/confidence/groundtruth) hold
# the values already fixed by design; anything still to be tuned is marked as such.

paths:
  dataset_dir: dataset
  cache_dir: data/cache
  outputs_dir: outputs
  gt_dir: gt
  report_dir: report

runs: [runA, runB]
cameras: [cam0, cam5]

# Step 0
decode:
  width: 640
  height: 480
  jpeg_quality: 3          # ffmpeg -q:v (2=best .. 31=worst)
  fps_mode: passthrough    # never resample; one JPEG per decoded frame (CLAUDE.md §5)

# Step 2
frames:
  crop_row_frac: 0.8       # keep rows [0, 0.8*H) — drops the wing-mirror/vignette band
  motion_thumb_w: 64        # why: small enough that JPEG noise/minor shake averages out, still
  motion_thumb_h: 48        #      shows genuine large-scale motion
  stationary_threshold_frac: 0.15   # why: both cameras below 15% of their own median motion
                                      #      energy count as low-motion
  stationary_min_length: 10          # why: a run must be >= 10 frames to count as a genuine
                                       #      stop, not just noise

# Step 3
descriptors:
  seqslam:
    thumb_w: 64
    thumb_h: 40
    patch: 8                # non-overlapping patch side for local (mean, std) normalisation
  dinov2:
    model: dinov2_vits14
    input_w: 448
    input_h: 280             # multiples of 14 (ViT patch size)
    device_preference: [mps, cpu]

similarity:
  contrast_window_candidates: [20, 50, 100]   # R — still to tune on synthetic warps
  contrast_window_seqslam: 50    # why: middle candidate; working default until a synthetic-warp
                                  #      harness picks a tuned value
  contrast_window_dinov2: 500    # why: window=50 (tuned for SeqSLAM's patch-level noise) collapses
                                  #      DINOv2's DTW path onto a single attractor column -- verified
                                  #      empirically that >=200 fixes it and 500/2622(global) behave
                                  #      almost identically, so 500 keeps some locality rather than
                                  #      going fully global
  camera_weights: {cam0: 1.0, cam5: 1.0}   # why: equal until real evidence favours one camera
  descriptor_weights: {seqslam: 1.0, dinov2: 1.0}  # why: equal until evidence favours one

# Step 4
align:
  dtw:
    lam_candidates: [0.1, 0.25, 0.5, 1.0]
    lam_default: 0.5
  local_slope_window: 21   # why: wide enough to smooth single-row noise, narrow enough to
                            #      still resolve a several-hundred-frame stop
  nullstate_dp:
    enabled: false            # why: scoped in but not built -- the shipped DTW-with-open-ends
                               #      design already meets the accuracy bar without a gap-aware
                               #      NULL state, and the added complexity isn't paid for by need

# Step 5
verify:
  ridge_window: 5     # why: mean similarity z-score along the path's own trajectory, over a
                       #      +/-5-row window centred on each point
  margin_band: 30      # why: excludes a +/-30-column band around the claimed match when
                        #      checking for a comparably strong alternative elsewhere
  sift:
    enabled: false            # why: scoped in but not built -- the shipped agreement cues
                               #      (ridge_z, margin_z, cam/desc disagreement) already meet
                               #      the accuracy bar without a geometric verification pass
    ratio_test: 0.8
  deletion_test:
    window_frames: 150

confidence:
  no_match_tau_default: 0.75   # from the deletion test -- still to calibrate
  tiers:                        # ordinal, not a calibrated probability
    - {value: 0.9, rule: "ridge_z >= 1.5 and both disagreements <= 3"}
    - {value: 0.7, rule: "ridge_z >= 1.0 and 2-of-3 agreement cues pass"}
    - {value: 0.5, rule: "ambiguous_range (inside a plateau)"}
    - {value: 0.4, rule: "matched but weak (default)"}

# Step 6
groundtruth:
  anchors_total: 30
  stratum_s: 22
  stratum_h: 8
  stratum_s_seed: 42     # why: determinism (CLAUDE.md §4) — same seed always gives the same anchors
  labeller_primary: user     # why: the human's label is authoritative; Claude's own pass is a
                              #      consistency check afterward, not an independent co-labeller
                              #      -- Claude's visual read can share failure modes with the
                              #      DINOv2 descriptor the pipeline itself uses, so the two are
                              #      not statistically independent judges
  match_tolerance_s: 0.5      # "same place" = within +/-0.5 s of runB travel
  sheets:
    coarse_step: 20    # why: coarse browsing step -- every 20th runB frame keeps the overview
                        #      sheet small while still covering the whole route
    fine_radius: 20    # why: wide enough to contain the true match even if the coarse pick is
                        #      a few seconds off

# Step 7
policy:
  interval_irregular_lo_ms: 80    # why: neighbours of an interval outside [80,120]ms are
  interval_irregular_hi_ms: 120   #      flagged as irregular -- a looser band than the
                                    #      [90,110]ms range used for Task 1's own
                                    #      characterisation stats, a different, stricter purpose
  tail_zone_lines: 50              # why: a round margin comfortably above the largest measured
                                    #      no_frame gap (48, runB/cam5), counted over the
                                    #      timestamp file's own last N lines
  dedup_keep_hz: 1.0                # why: keep one representative frame per second inside a
                                     #      stationary run, thin the rest
  place_id_bucket_frames: 100       # why: roughly 10s of route per place bucket, at ~10fps
  depot_runb_margin: 50             # why: runB frames within this many frames of either end of
                                     #      the route are the shared start/end depot, merged into
                                     #      one place_id so it can never masquerade as two
                                     #      distinct, independently-splittable places
  split_val_frac: 0.15
  split_test_frac: 0.15
  split_buffer_places: 1            # why: contiguous train/val/test blocks need a buffer
                                     #      between them so no place sits right on a split
                                     #      boundary

# Documented assumption, not a fact (CLAUDE.md §5): frame k == timestamp line k ==
# decoded frame k of each camera within a run.
index_convention: H0
